name: Safe Deploy to Hugging Face

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Fixes the Node 20 deprecation warning
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
      
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v5

      # 1. Download the existing HF Space
      - name: Clone Existing Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://gagan61:$HF_TOKEN@huggingface.co/spaces/gagan61/studybuddy-ai hf_workspace

      # 2. Inject files and generate the YAML config dynamically
      - name: Inject Updated Backend Files
        run: |
          cp -r app hf_workspace/
          cp requirements.txt hf_workspace/
          cp Dockerfile hf_workspace/

          # This creates the HF config dynamically on the runner.
          # It goes straight to HF and NEVER touches your GitHub README!
          cat << 'EOF' > hf_workspace/README.md
          ---
          title: StudyBuddy AI
          emoji: 📚
          colorFrom: blue
          colorTo: indigo
          sdk: docker
          pinned: false
          ---
          EOF

      # 3. Commit and push back to HF
      - name: Push Safely to Hugging Face
        run: |
          cd hf_workspace
          # Using standard GitHub Actions bot credentials for complete anonymity
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploying backend update via CI/CD" || echo "No changes to commit"
          git push origin main